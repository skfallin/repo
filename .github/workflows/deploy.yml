name: Deploy repo
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"  # picks up new releases of the repos in sources.txt
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false  # a scheduled no-op must not cancel a push deploy
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - run: command -v dpkg-scanpackages || (sudo apt-get update && sudo apt-get install -y dpkg-dev)
      - run: python3 build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: diff  # scheduled runs only deploy when the package list differs from the live one
        run: |
          if [ "${{ github.event_name }}" = schedule ] && curl -sf https://repo.torinz.it/Packages | cmp -s - _site/Packages; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
